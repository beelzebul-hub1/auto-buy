<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick Sniper</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0d0f;
    --surface:  #131316;
    --border:   #222228;
    --muted:    #3a3a44;
    --text:     #e8e8f0;
    --sub:      #7a7a8c;
    --green:    #53e07a;
    --red:      #ff4f4f;
    --yellow:   #f0c040;
    --accent:   #7c6aff;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Inter', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 380px 1fr;
    grid-template-rows: 56px 1fr;
  }

  /* HEADER */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .logo span { color: var(--accent); }
  .header-stat {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--sub);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* SIDEBAR */
  aside {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .form-wrap {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .form-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  label {
    font-size: 12px;
    color: var(--sub);
    display: block;
    margin-bottom: 4px;
  }

  input, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--surface); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .mode-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .mode-tab {
    padding: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: var(--sub);
    background: var(--bg);
    border: none;
    transition: background 0.15s, color 0.15s;
  }
  .mode-tab.active { background: var(--accent); color: #fff; }

  #reward-row { display: none; }

  .btn-start {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-start:hover { opacity: 0.85; }

  /* TASK LIST */
  .task-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .task-card:hover { border-color: var(--muted); }
  .task-card.selected { border-color: var(--accent); }

  .task-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .task-channel {
    font-size: 13px;
    font-weight: 600;
    flex: 1;
  }
  .badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 500;
  }
  .badge-sniper { background: rgba(124,106,255,.2); color: var(--accent); }
  .badge-watch  { background: rgba(240,192,64,.15); color: var(--yellow); }
  .badge-run    { background: rgba(83,224,122,.15);  color: var(--green); }
  .badge-stop   { background: rgba(255,79,79,.15);   color: var(--red); }

  .task-meta {
    font-size: 11px;
    color: var(--sub);
    display: flex;
    gap: 10px;
  }

  .task-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .btn-sm {
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 500;
    border-radius: 4px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: transparent;
    color: var(--sub);
    font-family: var(--sans);
    transition: all 0.15s;
  }
  .btn-sm:hover { background: var(--muted); color: var(--text); }
  .btn-sm.danger:hover { border-color: var(--red); color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--sub);
    font-size: 13px;
  }

  /* MAIN PANEL */
  main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .log-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .log-title {
    font-size: 13px;
    font-weight: 600;
  }
  .log-sub {
    font-size: 12px;
    color: var(--sub);
    margin-left: auto;
    font-family: var(--mono);
  }

  .log-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.8;
  }

  .log-line { color: var(--sub); }
  .log-line.redeemed { color: var(--green); }
  .log-line.available { color: var(--accent); }
  .log-line.error { color: var(--red); }
  .log-line.warn { color: var(--yellow); }

  .no-task {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--sub);
    gap: 8px;
  }
  .no-task-icon { font-size: 32px; opacity: .4; }
  .no-task-text { font-size: 13px; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <div class="logo">kick<span>sniper</span></div>
  <div class="header-stat" id="task-count">0 active</div>
</header>

<aside>
  <div class="form-wrap">
    <div class="form-title">New Task</div>

    <div>
      <label>Account</label>
      <select id="account">
        {% for acc in accounts %}
        <option value="{{ acc }}">{{ acc }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Streamer channel</label>
      <input type="text" id="channel" placeholder="e.g. waffletrades">
    </div>

    <div>
      <label>Mode</label>
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="2" onclick="setMode('2')">Sniper</button>
        <button class="mode-tab" data-mode="1" onclick="setMode('1')">Watch</button>
      </div>
    </div>

    <div id="reward-row">
      <label>Exact reward name</label>
      <input type="text" id="reward-name" placeholder="Exact name">
    </div>

    <div>
      <label>Message (optional)</label>
      <input type="text" id="message" placeholder="Leave blank if none">
    </div>

    <div class="row2">
      <div>
        <label>Min points</label>
        <input type="number" id="min-cost" placeholder="None">
      </div>
      <div>
        <label>Max points</label>
        <input type="number" id="max-cost" placeholder="None">
      </div>
    </div>

    <button class="btn-start" onclick="startTask()">Start</button>
  </div>

  <div class="task-list" id="task-list">
    <div class="empty-state" id="empty-msg">No tasks running</div>
  </div>
</aside>

<main id="main-panel">
  <div class="no-task" id="no-task">
    <div class="no-task-icon">⚡</div>
    <div class="no-task-text">Select a task to view logs</div>
  </div>
</main>

<script>
  let selectedMode = "2";
  let selectedTaskId = null;
  let logInterval = null;
  let taskInterval = null;

  function setMode(m) {
    selectedMode = m;
    document.querySelectorAll(".mode-tab").forEach(b => {
      b.classList.toggle("active", b.dataset.mode === m);
    });
    document.getElementById("reward-row").style.display = m === "1" ? "block" : "none";
  }

  async function startTask() {
    const account = document.getElementById("account").value;
    const channel = document.getElementById("channel").value.trim();
    const message = document.getElementById("message").value.trim();
    const rewardName = document.getElementById("reward-name").value.trim();
    const minCost = document.getElementById("min-cost").value;
    const maxCost = document.getElementById("max-cost").value;

    if (!channel) { alert("Enter a channel name"); return; }
    if (selectedMode === "1" && !rewardName) { alert("Enter the reward name for Watch mode"); return; }

    const res = await fetch("/api/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        account, channel, mode: selectedMode,
        message, reward_name: rewardName,
        min_cost: minCost || 0, max_cost: maxCost || 0
      })
    });

    const data = await res.json();
    if (data.error) { alert(data.error); return; }

    document.getElementById("channel").value = "";
    document.getElementById("message").value = "";
    document.getElementById("reward-name").value = "";

    selectTask(data.task_id);
    refreshTasks();
  }

  async function stopTask(id, e) {
    e.stopPropagation();
    await fetch(`/api/stop/${id}`, { method: "POST" });
    refreshTasks();
  }

  async function deleteTask(id, e) {
    e.stopPropagation();
    await fetch(`/api/delete/${id}`, { method: "POST" });
    if (selectedTaskId === id) {
      selectedTaskId = null;
      showNoTask();
    }
    refreshTasks();
  }

  function selectTask(id) {
    selectedTaskId = id;
    document.querySelectorAll(".task-card").forEach(c => {
      c.classList.toggle("selected", parseInt(c.dataset.id) === id);
    });
    showLogs(id);
    if (logInterval) clearInterval(logInterval);
    logInterval = setInterval(() => refreshLogs(id), 1000);
  }

  function showNoTask() {
    const main = document.getElementById("main-panel");
    main.innerHTML = `<div class="no-task" id="no-task">
      <div class="no-task-icon">⚡</div>
      <div class="no-task-text">Select a task to view logs</div>
    </div>`;
  }

  async function showLogs(id) {
    const res = await fetch(`/api/logs/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    renderLogPanel(id, data.logs);
  }

  async function refreshLogs(id) {
    if (selectedTaskId !== id) return;
    const res = await fetch(`/api/logs/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    const area = document.getElementById("log-area");
    if (!area) { renderLogPanel(id, data.logs); return; }
    const wasBottom = area.scrollHeight - area.clientHeight <= area.scrollTop + 40;
    area.innerHTML = formatLogs(data.logs);
    if (wasBottom) area.scrollTop = area.scrollHeight;
  }

  function formatLogs(logs) {
    if (!logs.length) return '<span style="color:var(--muted)">Waiting for activity...</span>';
    return logs.map(l => {
      let cls = "log-line";
      if (l.includes("✅") || l.includes("REDEEMED")) cls += " redeemed";
      else if (l.includes("🆕") || l.includes("✨") || l.includes("AVAILABLE")) cls += " available";
      else if (l.includes("❌") || l.includes("Error") || l.includes("expired")) cls += " error";
      else if (l.includes("⚠️") || l.includes("Rate")) cls += " warn";
      return `<div class="${cls}">${escHtml(l)}</div>`;
    }).join("");
  }

  function renderLogPanel(id, logs) {
    const main = document.getElementById("main-panel");
    const tasks_data = window._tasks || [];
    const task = tasks_data.find(t => t.id === id) || {};
    const modeLabel = task.mode === "1" ? "Watch" : "Sniper";
    const sub = task.reward_name ? `${task.reward_name}` : modeLabel;

    main.innerHTML = `
      <div class="log-header">
        <div class="log-title">${escHtml(task.channel || "")}</div>
        <div class="log-sub">${escHtml(task.account || "")} · ${escHtml(sub)}</div>
      </div>
      <div class="log-area" id="log-area">${formatLogs(logs)}</div>
    `;
    const area = document.getElementById("log-area");
    area.scrollTop = area.scrollHeight;
  }

  async function refreshTasks() {
    const res = await fetch("/api/tasks");
    const tasks = await res.json();
    window._tasks = tasks;

    const running = tasks.filter(t => t.status === "running").length;
    document.getElementById("task-count").textContent = `${running} active`;

    const list = document.getElementById("task-list");
    if (!tasks.length) {
      list.innerHTML = '<div class="empty-state" id="empty-msg">No tasks running</div>';
      return;
    }

    list.innerHTML = tasks.map(t => {
      const modeBadge = t.mode === "2"
        ? '<span class="badge badge-sniper">SNIPER</span>'
        : '<span class="badge badge-watch">WATCH</span>';
      const statusBadge = t.status === "running"
        ? '<span class="badge badge-run">LIVE</span>'
        : '<span class="badge badge-stop">STOPPED</span>';
      const isSelected = t.id === selectedTaskId;
      const rewardInfo = t.reward_name ? `· ${escHtml(t.reward_name)}` : "";

      return `<div class="task-card${isSelected ? " selected" : ""}" data-id="${t.id}" onclick="selectTask(${t.id})">
        <div class="task-top">
          <div class="task-channel">${escHtml(t.channel)}</div>
          ${modeBadge}
          ${statusBadge}
        </div>
        <div class="task-meta">
          <span>${escHtml(t.account)}</span>
          <span>${rewardInfo}</span>
        </div>
        <div class="task-actions">
          ${t.status === "running"
            ? `<button class="btn-sm" onclick="stopTask(${t.id}, event)">Stop</button>`
            : ""}
          <button class="btn-sm danger" onclick="deleteTask(${t.id}, event)">Remove</button>
        </div>
      </div>`;
    }).join("");
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Init
  taskInterval = setInterval(refreshTasks, 2000);
  refreshTasks();
</script>
</body>
</html>
